experiment_name: cn_hybrid_page
dataset: cn_annual_reports
retriever:
  type: hybrid_page
  search_scope: document
  page_methods:
    - bm25
    - dense
  encoder: BAAI/bge-small-zh-v1.5
#  encoder: BAAI/bge-m3
  require_model: true
  dense_max_seq_length: 128
  dense_batch_size: 8
  candidate_top_k: 20
  top_k: [1, 5, 10]
evaluation:
  metrics:
    - page_recall
    - mrr
    - ndcg
output_dir: runs/retrieval/cn_hybrid_page
