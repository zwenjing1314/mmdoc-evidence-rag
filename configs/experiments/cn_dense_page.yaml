experiment_name: cn_dense_page
dataset: cn_annual_reports
data_split:
  manifest: configs/splits/cn_annual_reports_company_v1.yaml
  name: test
retriever:
  type: dense_page
  search_scope: document
  encoder: BAAI/bge-small-zh-v1.5
#  encoder: BAAI/bge-m3
  require_model: true
  dense_max_seq_length: 128
  dense_batch_size: 8
  top_k: [1, 5, 10]
evaluation:
  metrics:
    - page_recall
    - mrr
    - ndcg
output_dir: runs/retrieval/cn_dense_page
