experiment_name: e04_page_region
dataset: mmdocir
retriever:
  type: page_region
  page_retriever: dense_page
  region_retriever: layout_node
  page_top_k: 10
  region_top_k: 5
  fusion:
    method: rrf
evaluation:
  metrics:
    - page_recall
    - region_hit
    - evidence_type_hit
    - mrr
    - ndcg
output_dir: runs/retrieval/e04_page_region
