experiment_name: mmdocir_dense_page_bge_m3
dataset: mmdocir_evaluation
retriever:
  type: dense_page
  search_scope: document
  encoder: BAAI/bge-m3
  require_model: true
  top_k: 20
  # MMDocIR OCR pages are long; this keeps 12 GB CUDA and 16 GB MPS memory stable.
  dense_max_seq_length: 512
  dense_batch_size: 2
output_dir: runs/retrieval/mmdocir_dense_page_bge_m3
