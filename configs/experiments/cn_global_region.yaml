experiment_name: cn_global_region
dataset: cn_annual_reports
data_split:
  manifest: configs/splits/cn_annual_reports_company_v1.yaml
  name: test
retriever:
  type: global_region
  search_scope: document
  method: dense
  encoder: BAAI/bge-small-zh-v1.5
#  encoder: BAAI/bge-m3
  require_model: true
  dense_max_seq_length: 128
  dense_batch_size: 8
  node_types:
    - paragraph
    - table_block
    - table_row
  region_top_k: 5
evaluation:
  metrics:
    - page_recall
    - region_hit
    - mrr
    - ndcg
output_dir: runs/retrieval/cn_global_region
