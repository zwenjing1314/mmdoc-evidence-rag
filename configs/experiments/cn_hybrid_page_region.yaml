experiment_name: cn_hybrid_page_region
dataset: cn_annual_reports
data_split:
  manifest: configs/splits/cn_annual_reports_company_v1.yaml
  name: test
retriever:
  type: hybrid_page_region
  search_scope: document
  page_methods:
    - bm25
    - dense
  encoder: BAAI/bge-small-zh-v1.5
#  encoder: BAAI/bge-m3
  require_model: true
  dense_max_seq_length: 128
  dense_batch_size: 8
  candidate_top_k: 20
  page_top_k: 10
  region_method: dense
  region_top_k: 5
  node_types:
    - paragraph
    - table_block
    - table_row
  fusion:
    method: rrf
evaluation:
  metrics:
    - page_recall
    - region_hit
    - mrr
    - ndcg
output_dir: runs/retrieval/cn_hybrid_page_region
