[project]
name = "mmdoc-evidence-rag"
version = "0.1.0"
description = "Experiments for multi-granularity evidence retrieval and trustworthy generation over multimodal long documents."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate",
  "datasets",
  "duckdb",
  "faiss-cpu",
  "huggingface-hub",
  "loguru",
  "numpy",
  "opencv-python",
  "openpyxl",
  "package-name>=0.1",
  "pandas",
  "pdfplumber",
  "pillow",
  "polars",
  "pyarrow",
  "pydantic>=2",
  "pydantic-settings",
  "pymupdf",
  "python-dotenv",
  "pyyaml",
  "rank-bm25",
  "ranx",
  "rich",
  "scikit-learn",
  "scipy",
  "sentence-transformers",
  "tokenizers",
  "tqdm",
  "transformers",
  "typer",
]

[project.optional-dependencies]
# Install on the CUDA evaluation machine before running the ColPali baseline.
colpali = [
  "colpali-engine>=0.3.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[dependency-groups]
dev = [
  "ipykernel",
  "jupyterlab",
  "mypy",
  "package-name>=0.1",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.uv]
package = true

# Windows GPU installation for the ColPali extra. The explicit index keeps
# regular uv syncs on PyPI while ensuring the ColPali environment gets CUDA
# wheels instead of the CPU-only PyPI builds.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
mdr = "mmdocrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmdocrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
